<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Gradients for the outer bezel ring -->
    <radialGradient id="grad_outer_bezel" cx="50%" cy="50%" r="50%">
      <stop offset="90%" stop-color="#FFFFFF" />
      <stop offset="94%" stop-color="#EEEEEE" />
      <stop offset="100%" stop-color="#CCCCCC" />
    </radialGradient>
    <radialGradient id="grad_inner_bezel" cx="50%" cy="50%" r="50%">
      <stop offset="90%" stop-color="#EEEEEE" />
      <stop offset="94%" stop-color="#DDDDDD" />
      <stop offset="100%" stop-color="#BBBBBB" />
    </radialGradient>
    
    <!-- Gradients for the main dial area -->
    <radialGradient id="grad_dial_background" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2A2A2A" />
      <stop offset="85%" stop-color="#111111" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>
    
    <!-- Gradients for the clock hands (metallic look) -->
    <linearGradient id="grad_hand_metallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#DDDDDD" />
      <stop offset="60%" stop-color="#AAAAAA" />
      <stop offset="100%" stop-color="#777777" />
    </linearGradient>
    
    <!-- Gradients for the center hub concentric rings -->
    <radialGradient id="grad_hub_rings" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0E0E0" />
      <stop offset="60%" stop-color="#B0B0B0" />
      <stop offset="100%" stop-color="#606060" />
    </radialGradient>
    
    <!-- Filter for subtle depth shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <filter id="shallow_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <!-- Base definitions for reusable dial marks to keep code clean and script-free -->
    <line id="minor-tick" x1="0" y1="-225" x2="0" y2="-216" stroke="#999999" stroke-width="1.5" />
    <rect id="major-marker" x="-2.5" y="-225" width="5" height="18" rx="1" fill="#F8F8F8" filter="url(#shallow_shadow)" />
  </defs>

  <g id="clock" transform="translate(250, 250)">
    
    <!-- OUTER BEZEL -->
    <g id="bezel">
      <circle r="248" fill="url(#grad_outer_bezel)" stroke="#B0B0B0" stroke-width="0.5"/>
      <circle r="238" fill="url(#grad_inner_bezel)" stroke="#909090" stroke-width="0.5"/>
    </g>
    
    <!-- BLACK DIAL -->
    <g id="dial">
      <circle id="dial_background" r="230" fill="url(#grad_dial_background)" filter="url(#shadow)" />
    </g>

    <!-- TICK MARKS (60 instances perfectly rotated) -->
    <g id="ticks">
      <use href="#minor-tick" transform="rotate(6)" />
      <use href="#minor-tick" transform="rotate(12)" />
      <use href="#minor-tick" transform="rotate(18)" />
      <use href="#minor-tick" transform="rotate(24)" />
      <use href="#minor-tick" transform="rotate(36)" />
      <use href="#minor-tick" transform="rotate(42)" />
      <use href="#minor-tick" transform="rotate(48)" />
      <use href="#minor-tick" transform="rotate(54)" />
      <use href="#minor-tick" transform="rotate(66)" />
      <use href="#minor-tick" transform="rotate(72)" />
      <use href="#minor-tick" transform="rotate(78)" />
      <use href="#minor-tick" transform="rotate(84)" />
      <use href="#minor-tick" transform="rotate(96)" />
      <use href="#minor-tick" transform="rotate(102)" />
      <use href="#minor-tick" transform="rotate(108)" />
      <use href="#minor-tick" transform="rotate(114)" />
      <use href="#minor-tick" transform="rotate(126)" />
      <use href="#minor-tick" transform="rotate(132)" />
      <use href="#minor-tick" transform="rotate(138)" />
      <use href="#minor-tick" transform="rotate(144)" />
      <use href="#minor-tick" transform="rotate(156)" />
      <use href="#minor-tick" transform="rotate(162)" />
      <use href="#minor-tick" transform="rotate(168)" />
      <use href="#minor-tick" transform="rotate(174)" />
      <use href="#minor-tick" transform="rotate(186)" />
      <use href="#minor-tick" transform="rotate(192)" />
      <use href="#minor-tick" transform="rotate(198)" />
      <use href="#minor-tick" transform="rotate(204)" />
      <use href="#minor-tick" transform="rotate(216)" />
      <use href="#minor-tick" transform="rotate(222)" />
      <use href="#minor-tick" transform="rotate(228)" />
      <use href="#minor-tick" transform="rotate(234)" />
      <use href="#minor-tick" transform="rotate(246)" />
      <use href="#minor-tick" transform="rotate(252)" />
      <use href="#minor-tick" transform="rotate(258)" />
      <use href="#minor-tick" transform="rotate(264)" />
      <use href="#minor-tick" transform="rotate(276)" />
      <use href="#minor-tick" transform="rotate(282)" />
      <use href="#minor-tick" transform="rotate(288)" />
      <use href="#minor-tick" transform="rotate(294)" />
      <use href="#minor-tick" transform="rotate(306)" />
      <use href="#minor-tick" transform="rotate(312)" />
      <use href="#minor-tick" transform="rotate(318)" />
      <use href="#minor-tick" transform="rotate(324)" />
      <use href="#minor-tick" transform="rotate(336)" />
      <use href="#minor-tick" transform="rotate(342)" />
      <use href="#minor-tick" transform="rotate(348)" />
      <use href="#minor-tick" transform="rotate(354)" />
    </g>

    <!-- MAJOR MARKERS (12 positions corresponding to hours) -->
    <g id="major-markers">
      <use href="#major-marker" transform="rotate(0)" />
      <use href="#major-marker" transform="rotate(30)" />
      <use href="#major-marker" transform="rotate(60)" />
      <use href="#major-marker" transform="rotate(90)" />
      <use href="#major-marker" transform="rotate(120)" />
      <use href="#major-marker" transform="rotate(150)" />
      <use href="#major-marker" transform="rotate(180)" />
      <use href="#major-marker" transform="rotate(210)" />
      <use href="#major-marker" transform="rotate(240)" />
      <use href="#major-marker" transform="rotate(270)" />
      <use href="#major-marker" transform="rotate(300)" />
      <use href="#major-marker" transform="rotate(330)" />
    </g>

    <!-- 12-HOUR NUMBERS -->
    <!-- Placed at an exact radius of 185px to avoid colliding with the markers at 207px -->
    <g id="numbers" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#EEEEEE" text-anchor="middle" dominant-baseline="central">
      <text x="0" y="-185">12</text>
      <text x="92.5" y="-160.2">1</text>
      <text x="160.2" y="-92.5">2</text>
      <text x="185" y="0">3</text>
      <text x="160.2" y="92.5">4</text>
      <text x="92.5" y="160.2">5</text>
      <text x="0" y="185">6</text>
      <text x="-92.5" y="160.2">7</text>
      <text x="-160.2" y="92.5">8</text>
      <text x="-185" y="0">9</text>
      <text x="-160.2" y="-92.5">10</text>
      <text x="-92.5" y="-160.2">11</text>
    </g>

    <!-- CLOCK HANDS -->
    <!-- All hands share the same origin point (0,0) for easy animation later -->
    <g id="hands">
      
      <!-- Hour Hand (Thick, slightly shorter) -->
      <g id="hour-hand" transform="rotate(305)">
        <path d="M -4,-115 L 0,-125 L 4,-115 L 3.5,15 L -3.5,15 Z" fill="url(#grad_hand_metallic)" stroke="#E0E0E0" stroke-width="0.75" filter="url(#shadow)" />
        <path d="M 0,-122 L 2.5,-116 L 2.5,12 L 0,12 Z" fill="#FFFFFF" opacity="0.8"/>
      </g>
      
      <!-- Minute Hand (Thinner, extending near the dial markers) -->
      <g id="minute-hand" transform="rotate(60)">
        <path d="M -3,-180 L 0,-190 L 3,-180 L 2.5,25 L -2.5,25 Z" fill="url(#grad_hand_metallic)" stroke="#E0E0E0" stroke-width="0.75" filter="url(#shadow)" />
        <path d="M 0,-187 L 2,-180 L 2,22 L 0,22 Z" fill="#FFFFFF" opacity="0.8"/>
      </g>
      
      <!-- Second Hand (Redesigned: High-visibility thin silver needle with counterweight) -->
      <g id="second-hand" transform="rotate(348)">
        <path d="M -1,-185 L 1,-185 L 1.5,45 L -1.5,45 Z" fill="#F0F0F0" filter="url(#shadow)" />
        <!-- Second hand center pivot base to ground it visually -->
        <circle cx="0" cy="0" r="3.5" fill="#FFFFFF" />
      </g>
      
    </g>

    <!-- CENTER HUB -->
    <!-- Positioned on top of the hands to cap them properly -->
    <g id="center-hub" filter="url(#shadow)">
      <circle r="18" fill="url(#grad_hub_rings)" stroke="#888888" stroke-width="0.5"/>
      <circle r="13" fill="#1A1A1A" stroke="#555555" stroke-width="0.5"/>
      <circle r="9" fill="url(#grad_hub_rings)" stroke="#999999" stroke-width="0.5"/>
      <circle id="center-cap" r="4" fill="#F8F8F8" stroke="#AAAAAA" stroke-width="0.5"/>
      <circle r="1" fill="#888888" />
    </g>

  </g>
</svg>
